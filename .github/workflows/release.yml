name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Validate manifest shape
        run: |
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool plugins/kestrel/.claude-plugin/plugin.json >/dev/null
          python -m json.tool plugins/kestrel/.codex-plugin/plugin.json >/dev/null
          python -m json.tool plugins/kestrel/.lsp.json >/dev/null
          test -f plugins/kestrel/skills/kestrel/SKILL.md

      - name: Package plugin
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist/kestrel-plugin
          cp -R .claude-plugin .agents plugins README.md dist/kestrel-plugin/
          tar -C dist -czf "kestrel-plugin-${TAG_NAME}.tar.gz" kestrel-plugin
          (cd dist && zip -qr "../kestrel-plugin-${TAG_NAME}.zip" kestrel-plugin)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Kestrel Plugin $TAG_NAME" \
            --generate-notes \
            "kestrel-plugin-${TAG_NAME}.tar.gz" \
            "kestrel-plugin-${TAG_NAME}.zip"
